<!doctype html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>html,body,#player{margin:0;width:100%;height:100%;background:#000;overflow:hidden}iframe{width:100%;height:100%;border:0}</style>
</head><body><div id="player"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
var player=null, ready=false, applying=false, lastSentPos=-1, lastSentPlaying=false, BRIDGE_NONCE='__BRIDGE_NONCE__';
function snapshot(kind, force){
  if(!player||!ready||applying)return;
  try{
    var st=player.getPlayerState(), pos=player.getCurrentTime()||0, playing=st===1, buffering=st===3, speed=player.getPlaybackRate?player.getPlaybackRate():1;
    if(!force && kind==='heartbeat' && Math.abs(pos-lastSentPos)<1.0 && playing===lastSentPlaying && !buffering)return;
    lastSentPos=pos; lastSentPlaying=playing;
    CoView.state(BRIDGE_NONCE,JSON.stringify({kind:kind||'heartbeat',playing:playing,pos:pos,duration:player.getDuration()||0,speed:speed,buffering:buffering,remote:false}));
  }catch(e){}
}
function onYouTubeIframeAPIReady(){
 player=new YT.Player('player',{videoId:'__VIDEO_ID__',playerVars:{playsinline:1,controls:1,rel:0,modestbranding:1,enablejsapi:1,origin:'https://coview.local'},events:{
  onReady:function(){ready=true;CoView.ready(BRIDGE_NONCE);snapshot('ready',true);},
  onStateChange:function(e){
    if(applying)return;
    if(e.data===1)snapshot('play',true);
    else if(e.data===2)snapshot('pause',true);
    else if(e.data===3)snapshot('buffering',true);
    else if(e.data===0)snapshot('ended',true);
  },
  onError:function(e){try{CoView.error(BRIDGE_NONCE,'YouTube could not play this video (error '+(e.data||'unknown')+').');}catch(x){}}
 }});
}
function coviewSetReady(){ if(ready)try{CoView.ready(BRIDGE_NONCE);}catch(e){} }
function coviewApply(pos,desiredPlaying,kind,desiredSpeed,desiredBuffering){
 if(!player||!ready)return false;
 try{
   var target=Number(pos)||0, current=player.getCurrentTime()||0, diff=Math.abs(current-target), state=player.getPlayerState();
   var speed=Number(desiredSpeed)||1, currentRate=player.getPlaybackRate?player.getPlaybackRate():1;
   var shouldSeek=(kind==='seek'||diff>1.2);
   var shouldPlay=state!==1&&desiredPlaying;
   var shouldPause=state===1&&!desiredPlaying;
   var shouldSpeed=Math.abs(currentRate-speed)>0.01;
   if(!shouldSeek&&!shouldPlay&&!shouldPause&&!shouldSpeed)return true;
   applying=true;
   if(shouldSeek)player.seekTo(target,true);
   if(shouldSpeed&&player.setPlaybackRate)player.setPlaybackRate(speed);
   if(!desiredBuffering){ if(kind==='play' || (kind==='heartbeat'&&desiredPlaying&&state!==1))player.playVideo(); else if(kind==='pause' || (kind==='heartbeat'&&!desiredPlaying&&state===1))player.pauseVideo(); }
   setTimeout(function(){applying=false;lastSentPos=target;lastSentPlaying=desiredPlaying;},450);
   return true;
 }catch(e){applying=false;return false;}
}
function coviewSetSpeed(speed){
 if(!player||!ready||!player.setPlaybackRate)return false;
 try{applying=true;player.setPlaybackRate(Number(speed)||1);setTimeout(function(){applying=false;snapshot('speed',true);},300);return true;}catch(e){applying=false;return false;}
}
function coviewState(){snapshot('heartbeat',true);}
setInterval(function(){snapshot('heartbeat',false);},2000);
</script></body></html>
