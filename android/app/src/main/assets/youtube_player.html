<!doctype html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>html,body,#player{margin:0;width:100%;height:100%;background:#000;overflow:hidden}iframe{width:100%;height:100%;border:0}</style>
</head><body><div id="player"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
var player=null, ready=false, applying=false, lastSentPos=-1, lastSentPlaying=false;
function snapshot(kind, force){
  if(!player||!ready||applying)return;
  try{
    var st=player.getPlayerState(), pos=player.getCurrentTime()||0, playing=st===1;
    if(!force && kind==='heartbeat' && Math.abs(pos-lastSentPos)<1.0 && playing===lastSentPlaying)return;
    lastSentPos=pos; lastSentPlaying=playing;
    CoView.state(JSON.stringify({kind:kind||'heartbeat',playing:playing,pos:pos,duration:player.getDuration()||0,remote:false}));
  }catch(e){}
}
function onYouTubeIframeAPIReady(){
 player=new YT.Player('player',{videoId:'__VIDEO_ID__',playerVars:{playsinline:1,controls:1,rel:0,modestbranding:1,enablejsapi:1},events:{
  onReady:function(){ready=true;CoView.ready();snapshot('ready',true);},
  onStateChange:function(e){
    if(applying)return;
    if(e.data===1)snapshot('play',true);
    else if(e.data===2)snapshot('pause',true);
    else if(e.data===0)snapshot('pause',true);
  },
  onError:function(e){try{CoView.error('YouTube could not play this video (error '+(e.data||'unknown')+').');}catch(x){}}
 }});
}
function coviewSetReady(){ if(ready)try{CoView.ready();}catch(e){} }
function coviewApply(pos,desiredPlaying,kind){
 if(!player||!ready)return false;
 try{
   var target=Number(pos)||0, current=player.getCurrentTime()||0, diff=Math.abs(current-target), state=player.getPlayerState();
   var shouldSeek=(kind==='seek'||diff>1.2);
   var shouldPlay=state!==1&&desiredPlaying;
   var shouldPause=state===1&&!desiredPlaying;
   if(!shouldSeek&&!shouldPlay&&!shouldPause)return true;
   applying=true;
   if(shouldSeek)player.seekTo(target,true);
   if(kind==='play' || (kind==='heartbeat'&&desiredPlaying&&state!==1))player.playVideo();
   else if(kind==='pause' || (kind==='heartbeat'&&!desiredPlaying&&state===1))player.pauseVideo();
   setTimeout(function(){applying=false;lastSentPos=target;lastSentPlaying=desiredPlaying;},450);
   return true;
 }catch(e){applying=false;return false;}
}
function coviewState(){snapshot('heartbeat',true);}
setInterval(function(){snapshot('heartbeat',false);},2000);
</script></body></html>
